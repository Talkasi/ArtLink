name: Run Tests on Push

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Docker tests
      run: |
        ls
        dotnet restore ArtLink.Tests.csproj

    - name: Run Unit Tests
      run: |
        ls
        dotnet test --filter "Category=Unit" --logger "trx;LogFileName=unit-tests.trx" --verbosity normal

    - name: Upload Unit Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: TestResults/unit-tests.trx

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: unit-tests
    defaults:
      run:
        working-directory: ${{ env.ROOT_DIR }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Start PostgreSQL
      run: |
        docker run -d --name db \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=artlink_test \
          -p 5433:5432 \
          postgres:15
        sleep 10

    - name: Run Integration Tests
      run: |
        ls
        dotnet test --filter "Category=Integration" --logger "trx;LogFileName=integration-tests.trx" --verbosity normal

    - name: Upload Integration Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: TestResults/integration-tests.trx

    - name: Stop PostgreSQL
      if: always()
      run: docker stop db && docker rm db

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: integration-tests
    defaults:
      run:
        working-directory: ${{ env.ROOT_DIR }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Start PostgreSQL
      run: |
        docker run -d --name db \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=artlink_test \
          -p 5433:5432 \
          postgres:15
        sleep 10

    - name: Run E2E Tests
      run: |
        ls
        dotnet test --filter "Category=EndToEnd" --logger "trx;LogFileName=e2e-tests.trx" --verbosity normal

    - name: Upload E2E Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: TestResults/e2e-tests.trx

    - name: Stop PostgreSQL
      if: always()
      run: docker stop db && docker rm db
