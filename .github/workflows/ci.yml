name: Run Tests on Push

on: [push]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Unit Tests in Container
      run: |
        cd ArtLink/ArtLink.Tests
        docker compose build test-runner
        docker compose run --rm -v $(pwd)/test-results:/test-results test-runner /run-unit-tests.sh

    - name: Upload Unit Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: TestResults/unit-tests.trx

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: unit-tests
    defaults:
      run:
        working-directory: ${{ env.ROOT_DIR }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start Database
      run: |
        cd ArtLink/ArtLink.Tests
        docker compose up -d db
        sleep 10

    - name: Start PostgreSQL
      run: |
        cd ArtLink/ArtLink.Tests
        # Добавляем volume для результатов
        docker compose run --rm -v $(pwd)/test-results:/test-results test-runner /run-integration-tests.sh

    - name: Upload Integration Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: TestResults/integration-tests.trx

    - name: Stop Database
      if: always()
      run: |
        cd ArtLink/ArtLink.Tests
        docker compose down

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: integration-tests
    defaults:
      run:
        working-directory: ${{ env.ROOT_DIR }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start Database
      run: |
        cd ArtLink/ArtLink.Tests
        docker compose up -d db
        sleep 10

    - name: Start PostgreSQL
      run: |
        cd ArtLink/ArtLink.Tests
        # Добавляем volume для результатов
        docker compose run --rm -v $(pwd)/test-results:/test-results test-runner /run-e2e-tests.sh

    - name: Upload E2E Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: TestResults/e2e-tests.trx

    - name: Stop PostgreSQL
      if: always()
      run: |
        cd ArtLink/ArtLink.Tests
        docker compose down -v

  test-report:
    runs-on: ubuntu-latest
    name: Test Report
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    
    steps:
    - name: Generate Test Summary
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY  
        echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY