name: Run Tests on Push

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Docker tests
      run: |
        cd ArtLink/ArtLink.Tests
        docker compose down
        docker compose up --build --exit-code-from tests --abort-on-container-exit
