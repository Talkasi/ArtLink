version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artlink_test
    ports:
      - "5433:5432"
    networks:
      - test-network

  test-runner:
    build:
      context: ..
      dockerfile: ArtLink.Tests/Dockerfile
    depends_on:
      - db
    networks:
      - test-network
    environment:
      DB_CONNECTION_STRING: "Host=db;Port=5432;Database=artlink_test;Username=postgres;Password=postgres"
    working_dir: /src/ArtLink.Tests

networks:
  test-network:
    driver: bridge